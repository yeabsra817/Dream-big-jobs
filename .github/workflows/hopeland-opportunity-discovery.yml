name: HopelandJobs 24/7 Opportunity Discovery (Every 6 Hours EAT)

# Mandatory Schedule: 00:00, 06:00, 12:00, 18:00 Africa/Addis_Ababa (UTC+3, no DST)
# Exact UTC equivalent: 21:00, 03:00, 09:00, 15:00 UTC — 365 days a year, independent of website visitors.
# Cost: $0/month on GitHub Actions. Runs 100% AI-independently across all 6 fault-isolated departments.
on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopeland-opportunity-discovery
  cancel-in-progress: false

jobs:
  discover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run 6-Department Global Banking, WASH & Permanent Residency Discovery (AI-Independent)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          OPPORTUNITY_SEARCH_PROVIDERS: auto
        run: |
          echo "Running HopelandJobs 6-Department Global Discovery at $(TZ='Africa/Addis_Ababa' date '+%Y-%m-%d %H:%M:%S EAT')"
          npx tsx scripts/run-autonomous-discovery.ts --trigger=github_actions_cron

      - name: Sync Live Production Server Cache (Optional — Only When CRON_SECRET Is Configured)
        continue-on-error: true
        env:
          APP_BASE_URL: ${{ secrets.HOPELAND_APP_URL || 'https://www.hopelandjobs.tech' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "INFO: CRON_SECRET repository secret is not configured; skipping optional remote webhook sync (standalone discovery already completed above)."
            exit 0
          fi

          echo "Syncing live production endpoint at ${APP_BASE_URL%/}/api/cron/global-opportunities?source=github_actions"
          curl -sS --fail-with-body --retry 2 --retry-delay 5 --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/global-opportunities?source=github_actions"

      - name: Upload Discovery Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hopeland-discovery-report-${{ github.run_number }}
          path: |
            data/latest_discovery_report.json
          retention-days: 14
          if-no-files-found: warn
