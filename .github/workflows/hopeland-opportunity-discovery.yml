name: HopelandJobs 24/7 Opportunity Discovery (Every 6 Hours EAT)

# Mandatory Schedule: 00:00, 06:00, 12:00, 18:00 Africa/Addis_Ababa (UTC+3, no DST)
# Exact UTC equivalent: 21:00, 03:00, 09:00, 15:00 UTC — 365 days a year, independent of website visitors.
# Cost: $0/month on GitHub Actions (works even on Vercel Hobby plan without paid Vercel Pro cron).
on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: hopeland-opportunity-discovery
  cancel-in-progress: false

jobs:
  discover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger HopelandJobs 6-Hour Official Discovery & Verification
        env:
          APP_BASE_URL: ${{ secrets.HOPELAND_APP_URL || 'https://www.hopelandjobs.tech' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET repository secret is not configured."
            echo "Add CRON_SECRET in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Triggering 6-hour Ethiopia Time discovery at $(TZ='Africa/Addis_Ababa' date '+%Y-%m-%d %H:%M:%S EAT')"
          RESPONSE=$(curl -sS --fail-with-body --retry 3 --retry-delay 10 --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/global-opportunities?source=github_actions")

          echo "$RESPONSE"
