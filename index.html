    <script>
      window.__hopelandDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__hopelandDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('hopeland-install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__hopelandDeferredInstallPrompt = null;
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var host = (window.location && window.location.hostname || '').toLowerCase();
          var isEmbedded = false;
          try { isEmbedded = window.self !== window.top; } catch (e) { isEmbedded = true; }
          var isPreviewHost =
            isEmbedded ||
            host.indexOf('ais-dev-') !== -1 ||
            host.indexOf('ais-pre-') !== -1 ||
            host.endsWith('.run.app') ||
            host.endsWith('.usercontent.goog') ||
            host === 'localhost' ||
            host === '127.0.0.1';
          if (isPreviewHost) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister().catch(function () {}); });
            }).catch(function () {});
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
              }).catch(function () {});
            }
          } else {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
          }
        });
      }
    </script>
